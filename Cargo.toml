[workspace]

[workspace.dependencies]
# Pinned to a commit; its embedded artifacts are vendored by
# `scripts/vendor-contracts.sh` (see the README).
libid-contracts = { git = "https://github.com/libid-org/libID-contracts", rev = "637b9255ca7fa60417a404fe491ee2ab8bf194c3" }

[package]
name = "relayer"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
alloy = { version = "2", features = ["contract", "network", "providers", "rpc-types", "transport-http"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
humantime-serde = "1"
libid-contracts.workspace = true
libid-signer = "0.9"
prometheus-client = "0.25"
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
alloy = { version = "2", features = ["json-rpc", "node-bindings", "provider-anvil-api", "signer-local"] }
libid-contracts = { workspace = true, features = ["testing"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
