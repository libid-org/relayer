name: CI

# Every third-party action is pinned by commit SHA, with the tag in a comment.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The versions libID-contracts' CI pins. Foundry builds the pinned crate's
  # artifacts and provides `anvil` for the tests.
  FOUNDRY_VERSION: v1.8.5
  RUST_VERSION: 1.97.1
  # For `cargo fmt` only: rustfmt.toml uses nightly-only options.
  NIGHTLY: nightly-2026-08-10

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # Nightly first: the action makes the last toolchain it installs the
      # default, and everything except `cargo fmt` runs on the pinned stable.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Before restoring the artifacts: cargo replaces a checkout that it did
      # not finish itself.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # The vendored artifacts depend only on the pin (in Cargo.lock) and the
      # Foundry version.
      - name: Restore vendored artifacts
        id: vendored
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/checkouts/libid-contracts-*/*/rust/contracts/artifacts
            ~/.cargo/git/checkouts/libid-contracts-*/*/rust/contracts/artifacts-testing
            ~/.cargo/git/checkouts/libid-contracts-*/*/rust/contracts/abi
          key: libid-contracts-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Vendor artifacts
        if: steps.vendored.outputs.cache-hit != 'true'
        run: scripts/vendor-contracts.sh

      - name: Formatting (nightly rustfmt)
        run: cargo +"$NIGHTLY" fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

  # Onboardings through compose.yaml's stack, over HTTP: the Rust test's, and
  # the TypeScript client's (ts/), whose checks run here too. The Rust test
  # compiles the contracts crate, so it vendors like the `rust` job.
  e2e:
    name: E2E (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Restore vendored artifacts
        id: vendored
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/checkouts/libid-contracts-*/*/rust/contracts/artifacts
            ~/.cargo/git/checkouts/libid-contracts-*/*/rust/contracts/artifacts-testing
            ~/.cargo/git/checkouts/libid-contracts-*/*/rust/contracts/abi
          key: libid-contracts-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Vendor artifacts
        if: steps.vendored.outputs.cache-hit != 'true'
        run: scripts/vendor-contracts.sh

      # The client's @libid/contracts, whose dist/ the script puts in the same
      # checkout; it depends only on the pin and the Foundry version. The e2e
      # tests compile their swap mocks with forge too.
      - name: Restore the contracts' TypeScript build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git/checkouts/libid-contracts-*/*/ts/packages/contracts/dist
          key: libid-contracts-ts-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('Cargo.lock') }}

      # pnpm before setup-node: `cache: pnpm` shells out to pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Build and install the client
        run: |
          scripts/vendor-contracts-ts.sh
          pnpm -C ts install --frozen-lockfile

      - name: Client checks
        run: |
          pnpm -C ts fmt:check
          pnpm -C ts lint
          pnpm -C ts typecheck
          pnpm -C ts test

      - name: Bring up the stack
        run: docker compose up -d --wait --build

      - name: Onboard through the stack
        run: cargo test --locked --test e2e -- --ignored --nocapture

      - name: Onboard through the client
        run: pnpm -C ts test:e2e

      - name: Logs
        if: failure()
        run: docker compose logs
