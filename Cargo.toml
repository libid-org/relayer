[workspace]

[workspace.dependencies]
# Pinned to a commit; its embedded artifacts are vendored by
# `scripts/vendor-contracts.sh` (see the README).
libid-contracts = { git = "https://github.com/libid-org/libID-contracts", rev = "dbe6ceb4f7521ced42eaec8deacf2082b8600ea5" }

[package]
name = "relayer"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
alloy = { version = "2", features = ["contract", "network", "providers", "rpc-types", "transport-http"] }
axum = "0.8"
libid-contracts.workspace = true
prometheus-client = "0.25"
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout"] }
tracing = "0.1"

[dev-dependencies]
alloy = { version = "2", features = ["json-rpc", "node-bindings", "provider-anvil-api", "signer-local"] }
libid-contracts = { workspace = true, features = ["testing"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3"
