# The libID relayer on one chain: `relayer --config relayer.toml run`.
#
# Every key is required unless marked optional. Durations are humantime ("200ms",
# "10s", "1h"); wei amounts are decimal strings. Relative paths are read from this
# file's directory. RELAYER_RPC_URL, RELAYER_SIGNER and RELAYER_PORT override the
# file.

[chain]
# The node's JSON-RPC endpoint. Prefer RELAYER_RPC_URL when it carries an API key;
# logs show only its scheme, host and port.
rpc_url = "https://sepolia.base.org"
chain_id = 84532
# Optional: a chain-configurations network file, whose chain_id must equal the one
# above.
# network_file = "../chain-configurations/networks/base-sepolia.toml"
# The chain's block time: the step of the base fee's growth.
block_time = "200ms"
# How often the relayer ticks. /health answers 503 once no tick succeeded for ten.
poll_interval = "1s"

[contracts]
# The wallet stack's addresses; chain-configurations does not list them yet.
factory = "0x0000000000000000000000000000000000000000"
forwarder = "0x0000000000000000000000000000000000000000"

[key]
# Optional: a 64-hex-digit private key, or an AWS KMS key id, alias or ARN, with its
# credentials from the AWS environment. Prefer RELAYER_SIGNER, so this file holds no
# secret.
# signer = "alias/libid-relayer"
# The signer's address, checked at start. Every refund pays it.
address = "0x0000000000000000000000000000000000000000"

[fees]
# How long a send may take to be included, and how long a quote stays valid; the fee
# cap covers the base fee's growth over both.
inclusion_window = "10s"
quote_validity = "10s"
# The fee-history percentile of a send's tip, between 50 and 90.
tip_percentile = 75.0
# "op-stack" bounds the L1 fee with the gas price oracle; "none" on anvil.
l1_fee = "op-stack"
# k: the refund covers k percent of getL1FeeUpperBound.
l1_margin_percent = 130
# M: a send's fee cap is at most M percent of the base fee. Start warns when it is
# under the base fee's growth over inclusion_window.
max_fee_percent = 200
# A cancel's highest fee cap, in percent of the base fee: at least 1.1 × M.
max_cancel_fee_percent = 1000
# "header" reads an OP-stack header's extraData; or a fixed rule:
# fee_params = { fixed = { denominator = 8, elasticity = 2, min_base_fee = 0 } }
fee_params = "header"

[state]
# The SQLite ledger, locked by one relayer at a time at `<db>.lock`.
db = "relayer.db"

[http]
# The API and /health, on every interface. RELAYER_PORT overrides it.
port = 8080
# /metrics, on every interface.
metrics_port = 9090
# A request over it answers 408; past the limit, requests wait.
request_timeout = "30s"
concurrency_limit = 64

[limits]
# What one wallet may cost in unrefunded sends before it is rate limited: at least
# max_gas_limit at max_fee_percent of the base fee, which start checks.
wallet_budget = { wei = "1000000000000000", window = "1h" }
# What all wallets may cost before sending pauses.
global_budget = { wei = "10000000000000000", window = "1h" }
# The highest gas limit a request may be priced for.
max_gas_limit = 5000000
# The wallet releases whose AUTHORIZED data the relayer decodes.
supported_releases = [1]
# Ticks of node errors on a request before it fails.
node_error_ticks = 5
# Blocks a receipt may lag its mined nonce before sending pauses.
receipt_lag_blocks = 50
# The balance below which start refuses and sending pauses.
min_balance = "50000000000000000"
